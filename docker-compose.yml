services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-4321}:4321"   # only the reverse proxy on this host can reach it; set BIND=0.0.0.0 to expose directly
    env_file: .env
    volumes:
      - ./storage:/data       # database + PDFs (back this folder up)
      - ./import:/import:ro   # drop .bib / .xlsx / PDFs here for the CLI
