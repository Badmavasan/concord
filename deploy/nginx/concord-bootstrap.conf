# Concord: HTTP-only bootstrap site, used once to obtain the first certificate.
# The full site (concord.conf) names certificate files, so nginx cannot start
# with it until they exist. Use this file first, then swap:
#
#   sudo cp deploy/nginx/concord-bootstrap.conf /etc/nginx/sites-available/concord
#   sudo ln -sf /etc/nginx/sites-available/concord /etc/nginx/sites-enabled/concord
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d concord.badmavasan.tech
#   sudo cp deploy/nginx/concord.conf /etc/nginx/sites-available/concord
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name concord.badmavasan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 120m;
    }
}
