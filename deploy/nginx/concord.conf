# Concord: nginx site configuration for concord.badmavasan.tech
#
# Install:
#   sudo cp deploy/nginx/concord.conf /etc/nginx/sites-available/concord
#   sudo ln -s /etc/nginx/sites-available/concord /etc/nginx/sites-enabled/concord
#   sudo certbot --nginx -d concord.badmavasan.tech      # or issue the cert first, then reload
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app is published by docker compose on 127.0.0.1:4700 (HOST_PORT in .env)
# and is never exposed directly. It sends its own security headers (CSP, nosniff,
# frame-ancestors, HSTS), so nginx only terminates TLS, proxies and rate-limits.
# APP_URL in .env must be https://concord.badmavasan.tech so cookies are Secure
# and invite links are correct.

upstream concord_app {
    server 127.0.0.1:4700;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=concord_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=concord_general:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name concord.badmavasan.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name concord.badmavasan.tech;

    ssl_certificate     /etc/letsencrypt/live/concord.badmavasan.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concord.badmavasan.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # PDFs up to 100 MB are accepted by the app; leave headroom for multipart framing.
    client_max_body_size 120m;
    client_body_timeout  120s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Sign-in, registration and invite lookups: the app rate-limits too, this is the outer wall.
    location ~ ^/api/auth/(login|register|forgot|reset/|invite/) {
        limit_req zone=concord_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://concord_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        limit_req zone=concord_general burst=100 nodelay;

        proxy_pass http://concord_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering on;
        proxy_redirect  off;
    }
}
